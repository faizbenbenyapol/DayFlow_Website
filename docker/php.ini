expose_php = Off
display_errors = On
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
upload_max_filesize = 20M
post_max_size = 22M
max_execution_time = 60
memory_limit = 256M

; --- OPcache ---
; Without this every request recompiles the whole request path (Router, the
; controller, its models and views), which dominates TTFB on a PHP app.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; The image bakes the source in, so files never change inside a running
; container. Revalidation is pure overhead in production; development mounts
; can override it through docker/php.dev.ini.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; --- Realpath cache ---
; The app resolves many require_once paths per request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
