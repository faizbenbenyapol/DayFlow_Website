; Development overrides, layered on top of dayflow.ini.
; The dev compose file bind-mounts the source into the container, so OPcache
; must notice edits instead of serving the copy it compiled at startup.
; Production keeps validate_timestamps=0 — the image bakes the source in.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
display_errors = On
